name: Atualizar Status BR-324

on:
  schedule:
    # Executa a cada 30 minutos
    - cron: '*/30 * * * *'
  workflow_dispatch:
    # Permite execução manual do workflow na aba Actions

jobs:
  atualizar:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Concede permissão para commitar as alterações de volta ao repositório

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Executar Script de Atualização
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
        run: python atualizar_br324.py

      - name: Commitar e Atualizar Banco Local
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados-transito.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: atualiza status de trafego [skip ci]" && git push)
